<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="description" content="ทางเข้าสู่ระบบเลือกตั้งกรรมการสภาพนักงานสำหรับอาจารย์และบุคลากร คณะสิ่งแวดล้อม มหาวิทยาลัยเกษตรศาสตร์">
  <meta name="voter-app-url" content="">
  <title>เลือกตั้งกรรมการสภาพนักงาน | คณะสิ่งแวดล้อม</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="links.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-content">
      <div class="brand">
        <span class="mark" aria-hidden="true">KU</span>
        <div><strong>คณะสิ่งแวดล้อม</strong><small>มหาวิทยาลัยเกษตรศาสตร์</small></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="title">
      <div class="hero-content">
        <h1 id="title">เลือกตั้งกรรมการสภาพนักงาน</h1>
        <p>สำหรับอาจารย์และบุคลากร คณะสิ่งแวดล้อม</p>
      </div>
      <div class="ballot-art" aria-hidden="true">
        <div class="ballot-paper">✓</div>
        <div class="ballot-box"></div>
      </div>
    </section>

    <section class="election-module" aria-label="ลงคะแนนและรายชื่อผู้สมัคร">
      <p class="frame-message" id="frame-message" role="status" hidden>กำลังเปิดแบบลงคะแนนและรายชื่อผู้สมัคร</p>
      <iframe id="election-frame" title="แบบลงคะแนนและรายชื่อผู้สมัคร" height="520" referrerpolicy="no-referrer" hidden></iframe>
      <a id="voter-fallback" hidden>เปิดเว็บลงคะแนนโดยตรง</a>
      <noscript><p class="frame-message">เปิด JavaScript เพื่อแสดงแบบลงคะแนนและรายชื่อผู้สมัคร</p></noscript>
    </section>
  </main>

  <footer class="wrap">คณะสิ่งแวดล้อม มหาวิทยาลัยเกษตรศาสตร์</footer>
</body>
</html>
